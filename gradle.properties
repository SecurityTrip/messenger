kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Kept off for now to keep first-run builds predictable; can enable later.
org.gradle.configuration-cache=false

# Allow configuring iOS targets on a non-macOS host (Windows/Linux).
# The targets are declared so macOS/CI can build them; here they are skipped.
kotlin.native.ignoreDisabledTargets=true
